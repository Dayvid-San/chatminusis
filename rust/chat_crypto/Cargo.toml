[package]
name = "chat_crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
description = "E2EE core of the chat app (MLS / RFC 9420 via OpenMLS)."

[features]
# Helpers that build *malicious* messages so the tests can prove they are
# refused. Never enabled in the app: only the self dev-dependency below uses it.
testing = []

# Draft post-quantum hybrid suite (ML-KEM-768 + X25519, Ed25519 signatures).
# OFF in the app: the MLS post-quantum drafts are not final yet. Tests turn it
# on (below) so the multi-suite plumbing is exercised with a real second suite.
pq-draft = [
  "openmls/draft-ietf-mls-pq-ciphersuites",
  "openmls_rust_crypto/draft-ietf-mls-pq-ciphersuites",
  "openmls_basic_credential/draft-ietf-mls-pq-ciphersuites",
  "openmls_traits/draft-ietf-mls-pq-ciphersuites",
]

[dev-dependencies]
chat_crypto = { path = ".", features = ["testing", "pq-draft"] }

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
openmls = "0.9.2"
openmls_rust_crypto = "0.6.0"
openmls_basic_credential = "0.6.0"
openmls_traits = "0.6.0"
tls_codec = "0.5"
thiserror = "2"
aes-gcm = "0.10"
sha2 = "0.10"
getrandom = "0.2"
zeroize = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
