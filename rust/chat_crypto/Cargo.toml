[package]
name = "chat_crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
description = "E2EE core of the chat app (MLS / RFC 9420 via OpenMLS)."

[features]
# Helpers that build *malicious* messages so the tests can prove they are
# refused. Never enabled in the app: only the self dev-dependency below uses it.
testing = []

[dev-dependencies]
chat_crypto = { path = ".", features = ["testing"] }

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
openmls = "0.9.2"
openmls_rust_crypto = "0.6.0"
openmls_basic_credential = "0.6.0"
openmls_traits = "0.6.0"
tls_codec = "0.5"
thiserror = "2"
aes-gcm = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
zeroize = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
